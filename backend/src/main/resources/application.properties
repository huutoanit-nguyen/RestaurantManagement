# ==================== DataSource ====================
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME:root}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_db}

# ==================== Hibernate ORM ====================
# Dev: tạo lại bảng mỗi lần chạy (mất dữ liệu cũ).
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=import.sql

# ==================== HTTP & CORS ====================
quarkus.http.port=${APP_PORT:8080}
quarkus.http.cors=true
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location,info
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# ==================== Logging ====================
quarkus.log.level=INFO
quarkus.log.category."org.hibernate.SQL".level=DEBUG

# ==================== Security (JWT) ====================
quarkus.security.jdbc.enabled=false

smallrye.jwt.sign.key.location=PrivateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=${JWT_ISSUER:restaurant-app}
